name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle size (size-limit, < 2 kB gzipped)
        run: npm run size
      - name: Tree-shaking check
        run: npm run treeshake
      - name: Verify tarball contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const [pkg] = require('./pack.json');
            const files = pkg.files.map(f => f.path).sort();
            const ok = files.every(f => f.startsWith('dist/') || ['package.json','README.md','LICENSE'].includes(f));
            console.log(files.join('\n'));
            if (!ok) { console.error('Unexpected files in tarball'); process.exit(1); }
          "
