name: Release

# Publishes to npm with provenance whenever a v* tag is pushed.
#
#   npm version patch        # bumps package.json, commits, creates the tag
#   git push --follow-tags   # triggers this workflow
#
# One-time setup on npmjs.com → package "sofar-json" → Settings → Publishing
# access → add a Trusted Publisher: GitHub Actions, repository
# acegikmo135/sofar, workflow file "release.yml". No NPM_TOKEN secret needed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Skip if this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "sofar-json@$VERSION" version >/dev/null 2>&1; then
            echo "sofar-json@$VERSION is already published — nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # prepublishOnly runs typecheck → test → build → size → treeshake first.
      - if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
